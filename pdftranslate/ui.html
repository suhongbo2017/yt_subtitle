<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫描件翻译 · 工作台</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d0f13;
    --panel: #15181e;
    --panel-2: #1b1f27;
    --line: #262b35;
    --fg: #e7eaf0;
    --dim: #8b93a5;
    --acc: #34d399;
    --acc-dim: #0f766e;
    --warn: #fbbf24;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--acc); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #161a21, #11141a);
    position: sticky; top: 0; z-index: 20;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--dim); font-size: 12px; }
  .pill {
    padding: 2px 9px; border-radius: 999px; font-size: 11px;
    background: var(--panel-2); color: var(--dim); border: 1px solid var(--line);
  }
  .pill.on { color: #06281c; background: var(--acc); border-color: var(--acc); font-weight: 600; }
  .pill.warn { color: #3a2703; background: var(--warn); border-color: var(--warn); font-weight: 600; }

  main {
    display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(340px, .85fr);
    gap: 16px; padding: 16px 22px 40px; align-items: start;
  }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden;
  }
  .panel > h2 {
    margin: 0; padding: 12px 14px; font-size: 12px; font-weight: 600;
    color: var(--dim); text-transform: uppercase; letter-spacing: .08em;
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  }
  .panel > h2 .grow { flex: 1; }
  .panel-body { padding: 12px 14px; }

  /* 文件列表 */
  .filelist { max-height: 46vh; overflow: auto; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-bottom: 1px solid #1e232b;
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #171b22; }
  .row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--acc); }
  .row .name { flex: 1; min-width: 0; }
  .row .name b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name small { color: var(--dim); font-size: 11px; }
  .badges { display: flex; gap: 4px; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .badge.hit { color: var(--acc); border-color: var(--acc-dim); }

  /* 设置 */
  .field { margin-bottom: 12px; }
  .field > label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .seg { display: flex; gap: 1px; background: var(--line); border-radius: 8px; padding: 1px; }
  .seg button {
    flex: 1; border: 0; background: transparent; color: var(--dim);
    padding: 7px 4px; border-radius: 7px; cursor: pointer; font-size: 12px;
  }
  .seg button.active { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 0 0 1px #2f3644; }
  input[type=text], input[type=number], select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; outline: none;
  }
  input:focus, select:focus { border-color: var(--acc-dim); box-shadow: 0 0 0 3px rgba(52,211,153,.12); }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--fg);
    -webkit-box-shadow: 0 0 0 1000px var(--panel-2) inset;
    caret-color: var(--fg);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .switch { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; font-size: 13px; }
  .switch input { width: 15px; height: 15px; accent-color: var(--acc); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 4px; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn {
    flex: 1; border: 1px solid var(--line); background: var(--panel-2);
    padding: 9px 14px; border-radius: 9px; cursor: pointer; font-size: 13px;
    transition: .12s;
  }
  .btn:hover:not(:disabled) { border-color: #38404f; background: #20262f; }
  .btn.primary { background: var(--acc); color: #052e20; border-color: var(--acc); font-weight: 600; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.tiny { flex: 0 0 auto; padding: 3px 10px; font-size: 11px; white-space: nowrap; }

  /* 进度 */
  .progress { height: 4px; background: #1c212a; overflow: hidden; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--acc); transition: width .3s; }

  /* 结果 */
  .result {
    display: flex; flex-direction: column; gap: 5px;
    padding: 10px 14px; border-bottom: 1px solid #1e232b;
  }
  .result .line1 { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
  .result .line1 b {
    font-weight: 500; font-size: 13px; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .result .meta { color: var(--dim); font-size: 11px; white-space: nowrap; }
  .result .links { display: flex; gap: 12px; font-size: 12px; }

  /* 日志 */
  #log {
    margin: 0; padding: 12px 14px; height: 220px; overflow: auto;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    color: #a8b1c2; background: #0f1216; white-space: pre-wrap; word-break: break-all;
  }
  #log .ok { color: var(--acc); }
  #log .bad { color: var(--err); }
  .drop {
    border: 1px dashed #333a47; border-radius: 10px; padding: 14px; text-align: center;
    color: var(--dim); font-size: 12px; cursor: pointer; margin: 0 14px 12px;
  }
  .drop.hot { border-color: var(--acc); color: var(--acc); background: rgba(52,211,153,.05); }
  /* 模型管理 */
  .mdl-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.62); backdrop-filter: blur(2px);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 24px;
  }
  .mdl-mask.open { display: flex; }
  .mdl {
    width: min(880px, 96vw); max-height: 88vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55);
  }
  .mdl header { position: static; background: var(--panel); border-radius: 14px 14px 0 0; }
  .mdl h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .mdl .body { padding: 14px 18px 18px; }
  .mrow {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 9px; margin-bottom: 8px;
  }
  .mrow .info { flex: 1; min-width: 0; }
  .mrow .info b { display: block; font-weight: 500; font-size: 13px; }
  .mrow .info small { color: var(--dim); font-size: 11px; word-break: break-all; }
  .mrow .ops { display: flex; gap: 6px; }
  .mrow .ops button {
    font-size: 11px; padding: 3px 9px; border-radius: 6px; cursor: pointer;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
  }
  .mrow .ops button:hover { color: var(--fg); border-color: #3a4252; }
  .mrow .ops button.danger:hover { color: var(--err); border-color: var(--err); }
  .mdl .sec-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); margin: 16px 0 8px;
  }
  .mdl .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .mdl .formgrid .full { grid-column: 1 / -1; }
  .testout { font-size: 12px; margin-top: 8px; min-height: 18px; }
  .testout.ok { color: var(--acc); }
  .testout.bad { color: var(--err); }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1f2530; border: 1px solid var(--line); color: var(--fg);
    padding: 9px 16px; border-radius: 999px; font-size: 12px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>扫描件翻译</h1>
  <span class="sub">视觉大模型 · 转写 + 翻译 + 覆盖式排版</span>
  <span style="flex:1"></span>
  <span class="pill" id="pillProvider">—</span>
  <span class="pill" id="pillKey">检查 Key…</span>
  <span class="pill" id="pillStatus">空闲</span>
</header>

<main>
  <!-- 左：文件 -->
  <section class="panel" style="min-width:0">
    <h2>
      待处理文件
      <span class="grow"></span>
      <button class="btn tiny" id="btnAll">全选</button>
      <button class="btn tiny" id="btnNone">清空</button>
      <button class="btn tiny" id="btnRefresh">刷新</button>
    </h2>
    <div class="drop" id="drop">把 PDF / 图片拖到这里，或点击选择文件</div>
    <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff" hidden>
    <div class="filelist" id="filelist"></div>
  </section>

  <!-- 右：设置 + 结果 -->
  <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
    <section class="panel">
      <h2>运行设置</h2>
      <div class="panel-body">
        <div class="field">
          <label>模型</label>
          <div style="display:flex;gap:8px">
            <select id="selModel" style="flex:1"></select>
            <button class="btn tiny" id="btnModels">管理</button>
          </div>
          <div class="hint" id="providerNote"></div>
        </div>
        <div class="field">
          <label>模型名覆盖 <span style="opacity:.6">（可选，留空用上面选定的）</span></label>
          <input type="text" id="inModel" placeholder="留空即使用所选模型自带的名称">
        </div>
        <div class="grid2">
          <div class="field">
            <label>目标语言</label>
            <select id="inTarget">
              <option>简体中文</option><option>繁體中文</option>
              <option>English</option><option>日本語</option>
            </select>
          </div>
          <div class="field">
            <label>页码范围</label>
            <input type="text" id="inPages" placeholder="全部，如 1-3,5">
          </div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>渲染 DPI</label>
            <input type="number" id="inDpi" value="250" min="120" max="400" step="10">
          </div>
          <div class="field">
            <label>并发页数</label>
            <input type="number" id="inConc" value="2" min="1" max="8">
          </div>
        </div>
        <label class="switch"><input type="checkbox" id="inHtml" checked> 生成覆盖式 HTML（按原版式覆盖译文）</label>
        <label class="switch"><input type="checkbox" id="inSkip"> 跳过已有输出的文件</label>
        <label class="switch"><input type="checkbox" id="inForce"> 忽略缓存重新请求</label>
        <div class="hint" id="estimate"></div>
        <div class="actions">
          <button class="btn primary" id="btnStart">开始翻译</button>
          <button class="btn" id="btnStop" disabled>停止</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>结果</h2>
      <div id="results"><div style="padding:14px;color:var(--dim);font-size:12px">还没有跑过任务</div></div>
    </section>
  </div>
</main>

<section class="panel" style="margin:0 22px 30px">
  <h2>运行日志 <span class="grow"></span><span id="logStat" style="font-weight:400"></span></h2>
  <div class="progress"><i id="bar"></i></div>
  <pre id="log"></pre>
</section>

<div class="mdl-mask" id="mdlMask">
  <div class="mdl">
    <header>
      <h3>模型管理</h3>
      <span style="flex:1"></span>
      <span class="sub" id="mdlHint">支持任意 OpenAI 兼容的视觉接口</span>
      <button class="btn tiny" id="mdlClose">关闭</button>
    </header>
    <div class="body">
      <div class="sec-title">已有模型</div>
      <div id="mdlList"></div>

      <div class="sec-title" id="formTitle">添加模型</div>
      <div class="formgrid">
        <div class="field"><label>id（唯一，英文）</label><input type="text" id="fId" placeholder="my-vl"></div>
        <div class="field"><label>显示名称</label><input type="text" id="fLabel" placeholder="我的视觉模型"></div>
        <div class="field full"><label>API 端点</label><input type="text" id="fBase" placeholder="https://xxx/v1"></div>
        <div class="field"><label>模型名</label><input type="text" id="fModel" placeholder="qwen3-vl-plus"></div>
        <div class="field"><label>Key 环境变量（可选）</label><input type="text" id="fEnv" placeholder="DASHSCOPE_API_KEY"></div>
        <div class="field full"><label>API Key（留空则不改动已保存的）</label><input type="password" id="fKey" placeholder="sk-..."></div>
        <div class="field full"><label>备注（可选）</label><input type="text" id="fNote" placeholder="用途说明"></div>
        <label class="switch"><input type="checkbox" id="fProxy"> 走代理（默认 http://127.0.0.1:7897）</label>
        <label class="switch"><input type="checkbox" id="fDefault"> 设为默认模型</label>
      </div>
      <div class="actions">
        <button class="btn primary" id="btnSaveModel">保存</button>
        <button class="btn" id="btnTestModel">测试连接</button>
        <button class="btn" id="btnResetForm">清空表单</button>
      </div>
      <div class="testout" id="testOut"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const selected = new Set();
let providers = {};
let provider = 'qwen';
let lastLogLen = -1;

function toast(msg, ms = 2200) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('json')) throw new Error(await r.text());
  return r.json();
}

/* ---------------- 设置区 / 模型 ---------------- */
let modelList = [];
let currentModel = localStorage.getItem('model_id') || '';

async function loadConfig() {
  const cfg = await api('/api/config');
  modelList = cfg.models;
  currentModel = modelList.some(m => m.id === currentModel) ? currentModel : cfg.default;
  renderModelSelect();
  updateKeyPill();
}

function renderModelSelect() {
  const sel = $('#selModel');
  sel.innerHTML = modelList.map(m =>
    `<option value="${m.id}">${m.label || m.id} · ${m.model}${m.has_key ? '' : '（缺 Key）'}</option>`
  ).join('');
  sel.value = currentModel;
  const m = modelList.find(x => x.id === currentModel);
  if (m) {
    $('#providerNote').textContent = (m.note || m.base_url) + (m.proxy ? '　·　走代理' : '');
    $('#pillProvider').textContent = m.id + ' · ' + m.model;
  }
}

function updateKeyPill() {
  const missing = modelList.filter(m => !m.has_key);
  const el = $('#pillKey');
  if (!missing.length) { el.textContent = 'API Key 就绪'; el.className = 'pill on'; }
  else { el.textContent = `${missing.length} 个模型缺 Key`; el.className = 'pill warn'; }
}

$('#selModel').addEventListener('change', (e) => {
  currentModel = e.target.value;
  localStorage.setItem('model_id', currentModel);
  renderModelSelect();
  updateEstimate();
});

/* ---------- 模型管理弹窗 ---------- */
function openModal() { $('#mdlMask').classList.add('open'); renderModelRows(); }
function closeModal() { $('#mdlMask').classList.remove('open'); }
$('#btnModels').onclick = openModal;
$('#mdlClose').onclick = closeModal;
$('#mdlMask').addEventListener('click', (e) => { if (e.target.id === 'mdlMask') closeModal(); });

function renderModelRows() {
  const box = $('#mdlList');
  if (!modelList.length) { box.innerHTML = '<div style="color:var(--dim);font-size:12px">还没有模型</div>'; return; }
  box.innerHTML = modelList.map(m => `
    <div class="mrow">
      <div class="info">
        <b>${m.label || m.id} ${m.id === defaultModelId() ? '<span class="badge hit">默认</span>' : ''}</b>
        <small>${m.id} · ${m.model} · ${m.base_url}</small>
        <small>${m.has_key ? '<span style="color:var(--acc)">Key 已就绪</span>' : '<span style="color:var(--warn)">未填 Key</span>'}${m.proxy ? ' · 代理' : ''}${m.builtin ? ' · 内置' : ''}</small>
      </div>
      <div class="ops">
        <button data-act="test" data-id="${m.id}">测试</button>
        <button data-act="edit" data-id="${m.id}">编辑</button>
        <button data-act="default" data-id="${m.id}">设默认</button>
        <button data-act="del" data-id="${m.id}" class="danger">删除</button>
      </div>
    </div>`).join('');
  box.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => modelAction(btn.dataset.act, btn.dataset.id);
  });
}

let _defaultId = '';
function defaultModelId() { return _defaultId; }

async function modelAction(act, id) {
  const m = modelList.find(x => x.id === id);
  if (!m) return;
  if (act === 'edit') { fillForm(m); return; }
  if (act === 'test') {
    $('#testOut').className = 'testout';
    $('#testOut').textContent = `测试 ${id} 中…`;
    const r = await api('/api/models/test', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    }).catch(e => ({ ok: false, error: String(e) }));
    if (r.ok) {
      $('#testOut').className = 'testout ok';
      $('#testOut').textContent = `✓ ${id} 可用 · ${r.latency_ms}ms · 回复：${r.reply || '(空)'}`;
    } else {
      $('#testOut').className = 'testout bad';
      $('#testOut').textContent = `✗ ${id}：${r.error}`;
    }
    return;
  }
  if (act === 'default') {
    await api('/api/models/default', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    await refreshModels();
    toast(`默认模型已设为 ${id}`);
    return;
  }
  if (act === 'del') {
    if (!confirm(`删除模型 ${id}？`)) return;
    const r = await api('/api/models/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id })
    });
    modelList = r.models; _defaultId = r.default;
    renderModelRows(); renderModelSelect(); updateKeyPill();
    toast('已删除');
  }
}

function fillForm(m) {
  $('#formTitle').textContent = '编辑模型：' + m.id;
  $('#fId').value = m.id; $('#fId').disabled = true;
  $('#fLabel').value = m.label || '';
  $('#fBase').value = m.base_url || '';
  $('#fModel').value = m.model || '';
  $('#fEnv').value = m.key_env || '';
  $('#fKey').value = '';
  $('#fKey').placeholder = m.has_key ? '已保存，留空则不修改' : 'sk-...';
  $('#fNote').value = m.note || '';
  $('#fProxy').checked = !!m.proxy;
  $('#fDefault').checked = m.id === _defaultId;
  $('#testOut').textContent = '';
}

function resetForm() {
  $('#formTitle').textContent = '添加模型';
  ['fId', 'fLabel', 'fBase', 'fModel', 'fEnv', 'fKey', 'fNote'].forEach(id => { $('#' + id).value = ''; $('#' + id).disabled = false; });
  $('#fProxy').checked = false; $('#fDefault').checked = false;
  $('#testOut').textContent = '';
}
$('#btnResetForm').onclick = resetForm;

async function refreshModels() {
  const cfg = await api('/api/models');
  modelList = cfg.models; _defaultId = cfg.default;
  if (!modelList.some(m => m.id === currentModel)) currentModel = _defaultId;
  renderModelRows(); renderModelSelect(); updateKeyPill();
  localStorage.setItem('model_id', currentModel);
}

$('#btnSaveModel').onclick = async () => {
  const payload = {
    id: $('#fId').value.trim(),
    label: $('#fLabel').value.trim(),
    base_url: $('#fBase').value.trim(),
    model: $('#fModel').value.trim(),
    key_env: $('#fEnv').value.trim(),
    api_key: $('#fKey').value.trim(),
    note: $('#fNote').value.trim(),
    proxy: $('#fProxy').checked,
    make_default: $('#fDefault').checked,
  };
  if (!payload.id || !payload.base_url || !payload.model) {
    $('#testOut').className = 'testout bad';
    $('#testOut').textContent = 'id / API 端点 / 模型名 必填';
    return;
  }
  const r = await api('/api/models/upsert', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  }).catch(e => ({ ok: false, error: String(e) }));
  if (!r.ok) {
    $('#testOut').className = 'testout bad';
    $('#testOut').textContent = r.error || '保存失败';
    return;
  }
  await refreshModels();
  resetForm();
  toast('已保存');
};

$('#btnTestModel').onclick = async () => {
  const payload = {
    id: $('#fId').value.trim(),
    base_url: $('#fBase').value.trim(),
    model: $('#fModel').value.trim(),
    api_key: $('#fKey').value.trim(),
    proxy: $('#fProxy').checked,
  };
  if (!payload.base_url || !payload.model) {
    $('#testOut').className = 'testout bad';
    $('#testOut').textContent = '填好 API 端点和模型名再测';
    return;
  }
  $('#testOut').className = 'testout';
  $('#testOut').textContent = '测试中…';
  const r = await api('/api/models/test', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  }).catch(e => ({ ok: false, error: String(e) }));
  if (r.ok) {
    $('#testOut').className = 'testout ok';
    $('#testOut').textContent = `✓ 可用 · ${r.latency_ms}ms · ${r.reply || ''}`;
  } else {
    $('#testOut').className = 'testout bad';
    $('#testOut').textContent = `✗ ${r.error}`;
  }
};

/* ---------------- 文件列表 ---------------- */
function renderFiles(files) {
  const box = $('#filelist');
  if (!files.length) {
    box.innerHTML = '<div style="padding:16px;color:var(--dim);font-size:12px">目录里没有 PDF 或图片，拖一个进来</div>';
    return;
  }
  box.innerHTML = '';
  files.forEach(f => {
    const row = document.createElement('label');
    row.className = 'row';
    const bd = [];
    if (f.pdf) bd.push('<span class="badge hit">PDF</span>');
    if (f.html) bd.push('<span class="badge hit">HTML</span>');
    if (f.md) bd.push('<span class="badge hit">MD</span>');
    row.innerHTML = `
      <input type="checkbox" ${selected.has(f.path) ? 'checked' : ''}>
      <span class="name"><b title="${f.name}">${f.name}</b>
        <small>${f.pages} 页 · ${f.size} MB · ${f.path}</small></span>
      <span class="badges">${bd.join('') || '<span class="badge">未处理</span>'}</span>`;
    row.querySelector('input').onchange = (e) => {
      e.target.checked ? selected.add(f.path) : selected.delete(f.path);
      updateEstimate();
    };
    box.appendChild(row);
  });
}

/* ---------------- 状态轮询 ---------------- */
let filesCache = [];
async function tick() {
  let st;
  try { st = await api('/api/state'); } catch { return; }
  filesCache = st.files || [];
  renderFiles(filesCache);

  const running = st.running;
  $('#pillStatus').textContent = running
    ? `运行中 ${st.done}/${st.total || '?'}`
    : (st.error ? '出错' : '空闲');
  $('#pillStatus').className = 'pill ' + (running ? 'on' : (st.error ? 'warn' : ''));
  $('#btnStart').disabled = running;
  $('#btnStop').disabled = !running;
  const pct = st.total ? Math.min(100, (st.done / st.total) * 100) : 0;
  $('#bar').style.width = pct + '%';
  $('#logStat').textContent = st.elapsed ? `${st.elapsed}s` : '';

  if (st.log.length !== lastLogLen) {
    lastLogLen = st.log.length;
    const log = $('#log');
    log.innerHTML = st.log.map(l =>
      `<span class="${/FAIL|出错|失败/.test(l) ? 'bad' : /ok|完成/.test(l) ? 'ok' : ''}">${escapeHtml(l)}</span>`
    ).join('\n');
    log.scrollTop = log.scrollHeight;
  }

  if (st.results && st.results.length !== renderFiles._n) {
    renderFiles._n = st.results.length;
    renderResults(st.results);
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

function renderResults(results) {
  const box = $('#results');
  if (!results.length) {
    box.innerHTML = '<div style="padding:14px;color:var(--dim);font-size:12px">还没有跑过任务</div>';
    return;
  }
  box.innerHTML = results.map(r => {
    const links = [];
    if (r.html) links.push(`<a href="/out/${encodeURI(r.html)}" target="_blank">HTML 预览</a>`);
    if (r.pdf) links.push(`<a href="/out/${encodeURI(r.pdf)}" target="_blank">双语 PDF</a>`);
    if (r.md) links.push(`<a href="/out/${encodeURI(r.md)}" target="_blank">译文 MD</a>`);
    const state = r.skipped ? '已跳过' : (r.failed.length ? `失败 ${r.failed.join(',')}` : '完成');
    return `<div class="result">
      <div class="line1"><b title="${r.name}">${r.name}</b>
        <span class="meta">${r.ok}/${r.pages} 页 · ${r.seconds}s · ${state}</span></div>
      <div class="links">${links.join('') || '—'}</div>
    </div>`;
  }).join('');
}

/* ---------------- 操作 ---------------- */
async function updateEstimate() {
  if (!selected.size) { $('#estimate').textContent = ''; return; }
  try {
    const r = await api('/api/estimate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: [...selected], pages: $('#inPages').value, concurrency: +$('#inConc').value })
    });
    $('#estimate').textContent = `已选 ${selected.size} 个文件，共 ${r.pages} 页，预计约 ${r.minutes} 分钟`;
  } catch { /* ignore */ }
}

async function start() {
  if (!selected.size) { toast('先选文件'); return; }
  const payload = {
    files: [...selected],
    provider: currentModel,
    model: $('#inModel').value,
    target: $('#inTarget').value,
    pages: $('#inPages').value,
    dpi: +$('#inDpi').value,
    concurrency: +$('#inConc').value,
    html: $('#inHtml').checked,
    skip_done: $('#inSkip').checked,
    force: $('#inForce').checked,
  };
  const r = await api('/api/start', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  }).catch(e => ({ ok: false, error: String(e) }));
  if (!r.ok) { toast(r.error || '启动失败', 3600); return; }
  renderFiles._n = -1;
  toast(`已开始：${r.total_files} 个文件 · ${r.provider}/${r.model}`);
}

$('#btnStart').onclick = start;
$('#btnStop').onclick = async () => { await api('/api/cancel', { method: 'POST' }); toast('已请求停止（当前文件完成后生效）'); };
$('#btnAll').onclick = () => { filesCache.forEach(f => selected.add(f.path)); renderFiles(filesCache); updateEstimate(); };
$('#btnNone').onclick = () => { selected.clear(); renderFiles(filesCache); updateEstimate(); };
$('#btnRefresh').onclick = () => { selection_prune(); tick(); };
function selection_prune() {
  const alive = new Set(filesCache.map(f => f.path));
  [...selected].forEach(p => { if (!alive.has(p)) selected.delete(p); });
}

['inPages', 'inConc'].forEach(id => $('#' + id).addEventListener('input', updateEstimate));

/* 上传 */
const drop = $('#drop'), input = $('#fileInput');
drop.onclick = () => input.click();
input.onchange = () => upload([...input.files]);
['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('hot'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', ev => upload([...ev.dataTransfer.files]));

async function upload(files) {
  if (!files.length) return;
  for (const f of files) {
    const r = await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method: 'POST', body: f });
    if (r.ok) { selected.add('_uploads/' + f.name); }
  }
  toast(`已上传 ${files.length} 个文件`);
  filesCache = (await api('/api/state')).files || [];
  renderFiles(filesCache);
  updateEstimate();
}

loadConfig().then(refreshModels);
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
