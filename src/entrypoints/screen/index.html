<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图翻译结果</title>
    <style>
      body { margin: 0; background: #17181b; color: #eee; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      .bar { position: sticky; top: 0; display: flex; gap: 14px; align-items: center; padding: 10px 16px;
             background: #101114; border-bottom: 1px solid #2a2c31; font-size: 13px; z-index: 10; }
      .bar b { font-weight: 600; }
      .bar .sp { flex: 1; }
      .bar label { display: flex; gap: 6px; cursor: pointer; align-items: center; color: #aab; }
      .stage { position: relative; margin: 18px auto; width: min(96vw, 1100px); background: #fff; }
      .stage img { display: block; width: 100%; }
      .layer { position: absolute; inset: 0; }
      .blk { position: absolute; overflow: hidden; padding: 1px 4px; border-radius: 3px;
             background: rgba(255,255,225,.92); color: #111; line-height: 1.3;
             font-size: calc(var(--base) * var(--scale)); white-space: pre-wrap; word-break: break-word;
             cursor: default; }
      .blk:hover { background: #ffe9a8; outline: 1px solid #d9a300; }
      .blk .en { display: block; font-size: .72em; color: #6b6b6b; margin-top: 2px; }
      body.only-zh .blk .en { display: none; }
      .empty { max-width: 700px; margin: 40px auto; padding: 20px; background: #22242a;
               border-radius: 10px; line-height: 1.8; font-size: 14px; }
      code { background: #2a2d33; padding: 1px 6px; border-radius: 4px; }
      .copy { position: absolute; right: 6px; top: 6px; font-size: 11px; color: #555; cursor: pointer;
              background: #fff9; border: 0; border-radius: 4px; padding: 2px 6px; }
    </style>
  </head>
  <body>
    <div class="bar">
      <b>截图翻译</b>
      <span class="sp"></span>
      <label><input type="checkbox" id="onlyZh" /> 只看译文</label>
      <label>字号 <input type="range" id="scale" min="0.6" max="1.8" step="0.05" value="1" /></label>
      <button id="print" style="border:0;background:#2a2d33;color:#ddd;border-radius:6px;padding:4px 10px;cursor:pointer">打印</button>
    </div>
    <div id="stage" class="stage"></div>
    <div id="info" class="empty" style="display:none"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
